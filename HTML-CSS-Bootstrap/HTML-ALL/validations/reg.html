<html>
    <head>
        <title>Registration Details</title>
    </head>
    <body>
        <h3>User Registration</h3>
        <form action="/reg">
            <label >User Name:</label>
            <input type="text" required tabindex="3"/> <br>

            <label >Mobile No:</label>
            <input type="number" required tabindex="1"> <br>

            <label >DOB:::::::::</label>
            <input type="date" required tabindex="4"/>
            <br>
            <label >Gender:</label>
            <input type="radio" name="xyz" tabindex="5" />Male
            <input type="radio" name="xyz"/>Female 
            <br>
            <label >State:::::</label>
           <select >
            <option >UP</option>
            <option >MP</option>
            <option >TS</option>
            <option >KA</option>
            <option >KK</option>
           </select> <br>
           <label >Message:</label>
           <textarea rows="4" cols="30" required tabindex="2"></textarea> <br>
            <input type="checkbox"/> Please Accept <a target="_blank" href="https://www.flipkart.com/pages/terms?otracker=footer_navlinks">T&C</a>  <br>
            <input type="submit" value="Registration">
            <input type="reset" value="Cancel">
        </form>
        
    </body>
</html>
